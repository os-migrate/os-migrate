name: Build and push builder image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "*"
    paths:
      - "builder/Containerfile"
      - ".github/workflows/build-builder.yml"

env:
  QUAY_USER: ${{ secrets.QUAY_USERNAME }}
  IMAGE_REGISTRY: quay.io
  QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
  QUAY_NAMESPACE: ${{ secrets.QUAY_NAMESPACE }}
  IMAGE_NAME: os-migrate-builder
  IMAGE_TAG: ${{ github.ref == 'refs/heads/main' && 'latest' || github.ref_name }}

jobs:
  build:
    name: Build and push builder image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Log in to quay.io registry
        uses: redhat-actions/podman-login@v1
        with:
          username: ${{ env.QUAY_USER }}
          password: ${{ env.QUAY_PASSWORD }}
          registry: ${{ env.IMAGE_REGISTRY }}

      - name: Build builder image
        run: |
          podman build \
            --tag "${{ env.IMAGE_REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
            --file builder/Containerfile \
            builder/

      - name: Push builder image
        run: |
          podman push \
            "${{ env.IMAGE_REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

      - name: Tag and push stable image on release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          podman tag \
            "${{ env.IMAGE_REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
            "${{ env.IMAGE_REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ env.IMAGE_NAME }}:stable"
          podman push \
            "${{ env.IMAGE_REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ env.IMAGE_NAME }}:stable"
