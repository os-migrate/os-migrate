- name: Import a workload
  block:
    - name: Preliminary setup for workload import
      os_migrate.os_migrate.import_workload_prelim:
        cloud: dst
        validate_certs: "{{ os_migrate_dst_validate_certs | default(omit) }}"
        ca_cert: "{{ os_migrate_dst_ca_cert | default(omit) }}"
        client_cert: "{{ os_migrate_dst_client_cert | default(omit) }}"
        client_key: "{{ os_migrate_dst_client_key | default(omit) }}"
        dst_filters: "{{ os_migrate_dst_filters }}"
        src_conversion_host:
          "{{ os_src_conversion_host_info.openstack_conversion_host | default({'id': 'none'}) }}"
        log_dir: "{{ os_migrate_data_dir }}/workload_logs"
        data: "{{ item }}"
      register: prelim

    - name: Show progress data
      ansible.builtin.debug:
        msg:
          - "{{ prelim.server_name }} log file: {{ prelim.log_file }}"
          - "{{ prelim.server_name }} progress file: {{ prelim.state_file }}"
      when:
        - prelim is defined and prelim.changed
        - item["_migration_params"]["data_copy"] | default(true)

    - name: Perform required checks to ensure destination cloud is ready
      os_migrate.os_migrate.import_workload_dst_check:
        cloud: dst
        validate_certs: "{{ os_migrate_dst_validate_certs | default(omit) }}"
        ca_cert: "{{ os_migrate_dst_ca_cert | default(omit) }}"
        client_cert: "{{ os_migrate_dst_client_cert | default(omit) }}"
        client_key: "{{ os_migrate_dst_client_key | default(omit) }}"
        data: "{{ item }}"
        dst_filters: "{{ os_migrate_dst_filters }}"
      when:
        - prelim is defined and prelim.changed

    # Stop VM if not stopped and if config set to true
    - name: Perform workload stop if os_migrate_workload_stop_before_migration is true
      os_migrate.os_migrate.server_action:
        cloud: src
        server: "{{ item['_info']['id'] }}"
        action: stop
        wait: true
        timeout: "{{ os_migrate_timeout }}"
        validate_certs: "{{ os_migrate_src_validate_certs | default(omit) }}"
        ca_cert: "{{ os_migrate_src_ca_cert | default(omit) }}"
        client_cert: "{{ os_migrate_src_client_cert | default(omit) }}"
        client_key: "{{ os_migrate_src_client_key | default(omit) }}"
      when:
        - prelim is defined and prelim.changed
        - os_migrate_workload_stop_before_migration | bool
        - item["_migration_params"]["data_copy"] | default(true)

    - name: Perform required checks to ensure source workload is ready
      os_migrate.os_migrate.import_workload_src_check:
        cloud: src
        validate_certs: "{{ os_migrate_src_validate_certs | default(omit) }}"
        ca_cert: "{{ os_migrate_src_ca_cert | default(omit) }}"
        client_cert: "{{ os_migrate_src_client_cert | default(omit) }}"
        client_key: "{{ os_migrate_src_client_key | default(omit) }}"
        name: "{{ item['_info']['id'] }}"
      when:
        - prelim is defined and prelim.changed
        - item["_migration_params"]["data_copy"] | default(true)

    - name: Open cloud.yaml and set cloud variables as ansible vars
      ansible.builtin.include_vars:
        file: "{{ os_migrate_clouds_path | default(os_migrate_data_dir ~ '/clouds.yaml') }}"
        name: cloud_vars
      when:
        - prelim is defined and prelim.changed

    - name: Set block_storage_api_version for source cloud is defined
      ansible.builtin.set_fact:
        cloud_vars_src: "{{ cloud_vars.clouds['src'] | combine({'block_storage_api_version': '3'}) }}"
      when:
        - prelim is defined and prelim.changed
        - item["_migration_params"]["data_copy"] | default(true)

    # Local hypervisor disks (boot/ephemeral/config drive) are transferred with
    # nbdkit direct, while attached Cinder volumes are transferred through the
    # source conversion host. An instance can have both, so detect each kind and
    # run both export paths when needed; the transfer step routes per disk.
    - name: Determine disk transfer paths for this workload
      ansible.builtin.set_fact:
        workload_use_nbdkit_direct: "{{ item['_migration_params']['use_nbdkit_direct'] | default(false) }}"
        workload_has_attached_volumes: "{{ (item['params']['volumes'] | default([])) | length > 0 }}"
      when:
        - prelim is defined and prelim.changed

    - name: Expose source volumes
      os_migrate.os_migrate.import_workload_export_volumes:
        cloud: "{{ cloud_vars_src }}"
        boot_volume_prefix: "{{ os_migrate_workload_boot_volume_prefix }}"
        conversion_host:
          "{{ os_src_conversion_host_info.openstack_conversion_host | default({'id': 'none'}) }}"
        # In mixed mode (nbdkit local disks + attached Cinder volumes), nbdkit
        # owns the boot/ephemeral disks. Force boot_disk_copy=false for this
        # conversion-host export so it does NOT synthesize a /dev/vda boot volume
        # that would collide with nbdkit's boot disk; only the real attached data
        # volumes are exposed through the conversion host.
        data: >-
          {{ (item | combine({'_migration_params':
                (item['_migration_params'] | combine({'boot_disk_copy': false}))},
                recursive=true))
             if (workload_use_nbdkit_direct | bool and workload_has_attached_volumes | bool)
             else item }}
        log_file: "{{ prelim.log_file }}"
        state_file: "{{ prelim.state_file }}"
        ssh_key_path: "{{ os_migrate_conversion_keypair_private_path }}"
        ssh_user: "{{ os_migrate_conversion_host_ssh_user }}"
        timeout: "{{ os_migrate_timeout }}"
      register: exports
      when:
        - prelim is defined and prelim.changed
        - item["_migration_params"]["data_copy"] | default(true)
        # Run whenever volumes must go through the conversion host: either a
        # classic (non-nbdkit) migration, or an nbdkit migration that also has
        # attached Cinder volumes to copy.
        - (not workload_use_nbdkit_direct | bool) or (workload_has_attached_volumes | bool)

    - name: Export volume map for nbdkit direct
      os_migrate.os_migrate.import_workload_export_volume_map:
        cloud: "{{ cloud_vars_src }}"
        data: "{{ item }}"
      register: exports_nbd
      when:
        - prelim is defined and prelim.changed
        - item["_migration_params"]["data_copy"] | default(true)
        - workload_use_nbdkit_direct | bool

    - name: Set exports from nbdkit volume map
      ansible.builtin.set_fact:
        exports: "{{ exports_nbd }}"
      when:
        - prelim is defined and prelim.changed
        - item["_migration_params"]["data_copy"] | default(true)
        - workload_use_nbdkit_direct | bool
        - not (workload_has_attached_volumes | bool)

    # Each disk keeps its original device path: Cinder volumes from their real
    # source attachment (e.g. /dev/vdb), local disks from import_from_hypervisor.
    # Refuse to merge if the two sets claim the same device path, since combine()
    # would silently drop the overwritten disk rather than reorder it.
    - name: Fail on device-path collision between local disks and attached volumes
      ansible.builtin.assert:
        that:
          - "((exports.volume_map.keys() | list) | intersect(exports_nbd.volume_map.keys() | list)) | length == 0"
        fail_msg: >-
          Device path collision between nbdkit local disks and attached Cinder
          volumes for {{ item['params']['name'] }}:
          {{ (exports.volume_map.keys() | list) | intersect(exports_nbd.volume_map.keys() | list) }}.
          Migrate the attached volume(s) separately with the detached_volumes
          workflow instead.
      when:
        - prelim is defined and prelim.changed
        - item["_migration_params"]["data_copy"] | default(true)
        - workload_use_nbdkit_direct | bool
        - workload_has_attached_volumes | bool

    # Preserve the conversion-host-only export (before merging in the nbdkit
    # local disks) so the source cleanup can act on just the Cinder volumes that
    # were attached to the source conversion host. The nbdkit local disks are
    # served by qemu-nbd on the hypervisor and must not be touched by it.
    - name: Preserve conversion-host volume map for source cleanup
      ansible.builtin.set_fact:
        workload_src_cleanup_exports: "{{ exports }}"
      when:
        - prelim is defined and prelim.changed
        - item["_migration_params"]["data_copy"] | default(true)
        - workload_use_nbdkit_direct | bool
        - workload_has_attached_volumes | bool

    # Mixed workload: keep the conversion-host transfer_uuid (needed for the SSH
    # forwarding of the Cinder volumes) and merge the nbdkit local-disk entries
    # into the conversion-host volume map. Device paths do not overlap, so a
    # plain combine yields the full set of disks for the transfer step.
    - name: Combine nbdkit and conversion-host volume maps
      ansible.builtin.set_fact:
        exports:
          transfer_uuid: "{{ exports.transfer_uuid }}"
          volume_map: "{{ exports.volume_map | combine(exports_nbd.volume_map) }}"
      when:
        - prelim is defined and prelim.changed
        - item["_migration_params"]["data_copy"] | default(true)
        - workload_use_nbdkit_direct | bool
        - workload_has_attached_volumes | bool

    - name: Transfer volumes to destination
      os_migrate.os_migrate.import_workload_transfer_volumes:
        cloud: dst
        validate_certs: "{{ os_migrate_dst_validate_certs | default(omit) }}"
        ca_cert: "{{ os_migrate_dst_ca_cert | default(omit) }}"
        client_cert: "{{ os_migrate_dst_client_cert | default(omit) }}"
        client_key: "{{ os_migrate_dst_client_key | default(omit) }}"
        data: "{{ item }}"
        conversion_host:
          "{{ os_dst_conversion_host_info.openstack_conversion_host }}"
        ssh_key_path: "{{ os_migrate_conversion_keypair_private_path }}"
        ssh_user: "{{ os_migrate_conversion_host_ssh_user }}"
        transfer_uuid: "{{ exports.transfer_uuid }}"
        src_conversion_host_address:
          "{{ os_src_conversion_host_info.openstack_conversion_host.address | default('') }}"
        volume_map: "{{ exports.volume_map }}"
        log_file: "{{ prelim.log_file }}"
        state_file: "{{ prelim.state_file }}"
        timeout: "{{ os_migrate_timeout }}"
        use_nbdkit_direct: "{{ item['_migration_params']['use_nbdkit_direct'] | default(false) }}"
        nbdkit_socket_uri: "{{ item['_migration_params']['nbdkit_socket_uri'] | default(omit) }}"
        nbdkit_export_name: "{{ item['_migration_params']['nbdkit_export_name'] | default(omit) }}"
      register: transfer
      when:
        - prelim is defined and prelim.changed
        - item["_migration_params"]["data_copy"] | default(true)

    - name: Create destination instance
      os_migrate.os_migrate.import_workload_create_instance:
        cloud: dst
        validate_certs: "{{ os_migrate_dst_validate_certs | default(omit) }}"
        ca_cert: "{{ os_migrate_dst_ca_cert | default(omit) }}"
        client_cert: "{{ os_migrate_dst_client_cert | default(omit) }}"
        client_key: "{{ os_migrate_dst_client_key | default(omit) }}"
        data: "{{ item }}"
        block_device_mapping: "{{ transfer.block_device_mapping | default([]) }}"
      register: os_migrate_destination_instance
      when:
        - prelim is defined and prelim.changed

    - name: Clean up in the source cloud after migration
      os_migrate.os_migrate.import_workload_src_cleanup:
        cloud: src
        validate_certs: "{{ os_migrate_src_validate_certs | default(omit) }}"
        ca_cert: "{{ os_migrate_src_ca_cert | default(omit) }}"
        client_cert: "{{ os_migrate_src_client_cert | default(omit) }}"
        client_key: "{{ os_migrate_src_client_key | default(omit) }}"
        data: "{{ item }}"
        conversion_host: "{{ os_src_conversion_host_info.openstack_conversion_host }}"
        ssh_key_path: "{{ os_migrate_conversion_keypair_private_path }}"
        ssh_user: "{{ os_migrate_conversion_host_ssh_user }}"
        transfer_uuid: "{{ exports.transfer_uuid }}"
        # In mixed mode only the conversion-host (Cinder) volumes were attached
        # to the source conversion host; use that map so the nbdkit local disks
        # (served by qemu-nbd on the hypervisor) are left untouched.
        volume_map: "{{ (workload_src_cleanup_exports | default(exports)).volume_map }}"
        log_file: "{{ prelim.log_file }}"
        state_file: "{{ prelim.state_file }}"
        timeout: "{{ os_migrate_timeout }}"
      when:
        - prelim is defined and prelim.changed
        - item["_migration_params"]["data_copy"] | default(true)
        # Run whenever volumes went through the conversion host: classic
        # (non-nbdkit) migrations, or mixed nbdkit migrations with attached
        # Cinder volumes.
        - (not workload_use_nbdkit_direct | bool) or (workload_has_attached_volumes | bool)

  rescue:
    - name: Clean up in the source cloud after migration failure
      os_migrate.os_migrate.import_workload_src_cleanup:
        cloud: src
        validate_certs: "{{ os_migrate_src_validate_certs | default(omit) }}"
        ca_cert: "{{ os_migrate_src_ca_cert | default(omit) }}"
        client_cert: "{{ os_migrate_src_client_cert | default(omit) }}"
        client_key: "{{ os_migrate_src_client_key | default(omit) }}"
        data: "{{ item }}"
        conversion_host: "{{ os_src_conversion_host_info.openstack_conversion_host }}"
        ssh_key_path: "{{ os_migrate_conversion_keypair_private_path }}"
        ssh_user: "{{ os_migrate_conversion_host_ssh_user }}"
        transfer_uuid: "{{ exports.transfer_uuid }}"
        # Mixed mode: clean up only the conversion-host (Cinder) volumes; the
        # nbdkit local disks were never attached to the source conversion host.
        volume_map: "{{ (workload_src_cleanup_exports | default(exports)).volume_map }}"
        log_file: "{{ prelim.log_file }}"
        state_file: "{{ prelim.state_file }}"
        timeout: "{{ os_migrate_timeout }}"
      when:
        - prelim is defined and prelim.changed
        - os_migrate_workload_cleanup_on_failure
        - exports is defined and 'volume_map' in exports
        - item["_migration_params"]["data_copy"] | default(true)
        # Run whenever volumes went through the conversion host: classic
        # (non-nbdkit) migrations, or mixed nbdkit migrations with attached
        # Cinder volumes.
        - (not workload_use_nbdkit_direct | bool) or (workload_has_attached_volumes | bool)

    - name: Clean up in the destination cloud after migration failure
      os_migrate.os_migrate.import_workload_dst_failure_cleanup:
        cloud: dst
        validate_certs: "{{ os_migrate_dst_validate_certs | default(omit) }}"
        ca_cert: "{{ os_migrate_dst_ca_cert | default(omit) }}"
        client_cert: "{{ os_migrate_dst_client_cert | default(omit) }}"
        client_key: "{{ os_migrate_dst_client_key | default(omit) }}"
        data: "{{ item }}"
        conversion_host: "{{ os_dst_conversion_host_info.openstack_conversion_host }}"
        ssh_key_path: "{{ os_migrate_conversion_keypair_private_path }}"
        ssh_user: "{{ os_migrate_conversion_host_ssh_user }}"
        transfer_uuid: "{{ exports.transfer_uuid }}"
        volume_map: "{{ transfer.volume_map }}"
        log_file: "{{ prelim.log_file }}"
        state_file: "{{ prelim.state_file }}"
        timeout: "{{ os_migrate_timeout }}"
      when:
        - prelim is defined and prelim.changed
        - os_migrate_workload_cleanup_on_failure
        - exports is defined and 'volume_map' in exports
        - transfer is defined and 'volume_map' in transfer
        - item["_migration_params"]["data_copy"] | default(true)

    - name: Fail if there was a problem in the migration
      ansible.builtin.fail:
        msg: "Failed to import {{ item.params.name }}."
