---
# Single-node kind cluster for the AWX functional tests.
# The AWX web service is exposed as a NodePort (30080) and mapped to
# localhost:8080 on the host, so no kubectl port-forward is needed.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
