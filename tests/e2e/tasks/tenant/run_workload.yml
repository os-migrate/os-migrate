# FIXME: Find a way we can test the whole playbook rather than just
# the role. Either make sure we're not in a play here and use
# import_playbook, or spawn an ansible-playbook subprocess? The latter
# might be actually a more precise way to test the real end-user
# experience.

- name: Workloads tasks
  block:
    # nbdkit reads the instance's local disks with qemu-nbd, which requires the
    # source instance to be SHUTOFF. It must be stopped BEFORE export, because
    # import_from_hypervisor checks the _info.status recorded in workloads.yml
    # (captured at export time), not the live state -- stopping after export
    # would still leave ACTIVE in the exported data.
    - name: stop the source instance before nbdkit-direct export
      os_migrate.os_migrate.server_action:
        server: osm_server
        action: stop
        wait: true
        timeout: "{{ os_migrate_timeout | default(1800) }}"
        auth: "{{ os_migrate_src_auth }}"
        validate_certs: "{{ os_migrate_src_validate_certs | default(omit) }}"
        ca_cert: "{{ os_migrate_src_ca_cert | default(omit) }}"
        client_cert: "{{ os_migrate_src_client_cert | default(omit) }}"
        client_key: "{{ os_migrate_src_client_key | default(omit) }}"
      when: set_nbdkit_direct|default(false)|bool

    - name: export workloads
      ansible.builtin.include_role:
        name: os_migrate.os_migrate.export_workloads
      vars:
        # This expression should export all osm_ workloads
        # skipping the universal conversion host (osm_uch)
        # which is used to move the VM's.
        # We create it on in seed.yml but we dont export it.
        os_migrate_workloads_filter:
          - regex: '^osm_(?!uch)'

    - name: export detached volumes
      ansible.builtin.include_role:
        name: os_migrate.os_migrate.export_detached_volumes
      vars:
        os_migrate_volumes_filter:
          - regex: '^osm_detached_volume'
      when: test_detached_volumes|default(false)|bool

    - name: set boot disk copy
      ansible.builtin.replace:
        path: "{{ os_migrate_data_dir }}/workloads.yml"
        regexp: "boot_disk_copy: false"
        replace: "boot_disk_copy: true"
      when: set_boot_disk_copy|default(false)|bool

    - name: set data copy
      ansible.builtin.replace:
        path: "{{ os_migrate_data_dir }}/workloads.yml"
        regexp: "data_copy: true"
        replace: "data_copy: false"
      when: set_no_data_copy|default(false)|bool

    - name: set port creation mode to neutron
      ansible.builtin.replace:
        path: "{{ os_migrate_data_dir }}/workloads.yml"
        regexp: "port_creation_mode: nova"
        replace: "port_creation_mode: neutron"
      when: port_creation_mode|default("nova") == 'neutron'

    - name: set use_nbdkit_direct
      ansible.builtin.replace:
        path: "{{ os_migrate_data_dir }}/workloads.yml"
        regexp: "use_nbdkit_direct: false"
        replace: "use_nbdkit_direct: true"
      when: set_nbdkit_direct|default(false)|bool

    - name: create and set existing FIP
      ansible.builtin.include_tasks: run_workload_existing_fip.yml
      when: set_floating_ip_mode|default('') == 'existing'

    - name: load exported data
      ansible.builtin.set_fact:
        resources: "{{ (lookup('file',
                               os_migrate_data_dir +
                               '/workloads.yml') | from_yaml)
                       ['resources'] }}"

    - name: verify data contents
      ansible.builtin.assert:
        that:
          - ( item | os_migrate.os_migrate.json_query('params.name') == 'osm_server' )
      loop: "{{ resources }}"

    - name: import detached volumes
      ansible.builtin.include_role:
        name: os_migrate.os_migrate.import_detached_volumes
      when: test_detached_volumes|default(false)|bool

    # nbdkit reads the instance's local disks with qemu-nbd, which requires the
    # source instance to be SHUTOFF. The stop inside import_workloads runs too
    # late (after import_from_hypervisor), so stop it explicitly here first.
    - name: stop the source instance before nbdkit-direct transfer
      os_migrate.os_migrate.server_action:
        server: "{{ resources[0]['_info']['id'] }}"
        action: stop
        wait: true
        timeout: "{{ os_migrate_timeout | default(1800) }}"
        auth: "{{ os_migrate_src_auth }}"
        validate_certs: "{{ os_migrate_src_validate_certs | default(omit) }}"
        ca_cert: "{{ os_migrate_src_ca_cert | default(omit) }}"
        client_cert: "{{ os_migrate_src_client_cert | default(omit) }}"
        client_key: "{{ os_migrate_src_client_key | default(omit) }}"
      when: set_nbdkit_direct|default(false)|bool

    # import_from_hypervisor delegates to the Nova hypervisor by its hostname,
    # which the migrator (here the e2e container) usually cannot resolve or SSH
    # to. Register it in the in-memory inventory with a reachable address + SSH
    # credentials so delegate_to connects. Set os_migrate_hypervisor_address /
    # os_migrate_hypervisor_ssh_user / os_migrate_hypervisor_ssh_private_key for
    # your environment (scenario_variables.yml).
    - name: register the source hypervisor for nbdkit delegation
      ansible.builtin.add_host:
        name: "{{ resources[0]['_info']['hypervisor_hostname'] }}"
        ansible_host: "{{ os_migrate_hypervisor_address }}"
        ansible_user: "{{ os_migrate_hypervisor_ssh_user }}"
        ansible_ssh_private_key_file: "{{ os_migrate_hypervisor_ssh_private_key | default(omit, true) }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      changed_when: false
      when: set_nbdkit_direct|default(false)|bool

    # Spawn qemu-nbd on the source hypervisor for every local disk of the
    # nbdkit-direct workloads. Must run after export (so use_nbdkit_direct is
    # set in workloads.yml) and before import_workloads (which consumes the
    # nbdkit URIs). In a mixed workload the attached Cinder volumes are still
    # transferred through the conversion host by import_workloads.
    - name: spawn nbdkit on the source hypervisor
      ansible.builtin.include_role:
        name: os_migrate.os_migrate.import_from_hypervisor
      when: set_nbdkit_direct|default(false)|bool

    - name: import workloads
      ansible.builtin.include_role:
        name: os_migrate.os_migrate.import_workloads
