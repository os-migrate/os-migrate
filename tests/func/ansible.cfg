# The 'yaml' stdout callback was removed from ansible-core (it now lives in
# community.general); using it here broke `ansible-playbook` with a "Could not
# load 'yaml' callback plugin" error. Use the built-in default callback and keep
# profile_tasks for timing. Enable the yaml callback locally by installing
# community.general and setting ANSIBLE_STDOUT_CALLBACK=community.general.yaml.
[defaults]
callbacks_enabled = profile_tasks
json_indent = 4
